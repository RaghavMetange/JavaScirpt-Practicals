<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Calculator</title>
</head>
<body>
    <h1>Billing Calculator</h1>
    
    <label for="amount">Bill Amount ($):</label>
    <input type="number" id="amount" placeholder="Enter bill total" value="100"><br><br>

    <label for="tax">Tax Rate (%):</label>
    <input type="number" id="tax" placeholder="Enter tax percentage" value="10"><br><br>

    <label for="discount">Discount Amount ($):</label>
    <input type="number" id="discount" placeholder="Enter discount" value="5"><br><br>

    <button id="calcBtn">Calculate Total</button>

    <div id="result"></div>

    <!-- Linked to the calculator script -->
    <script src="calculator.js"></script>
</body>
</html>
